name: WireMock API Tests

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Build HTML report
        if: always()
        run: mvn -B surefire-report:report-only site -DgenerateReports=false

      - name: Prepare report for GitHub Pages
        if: always()
        run: |
          mkdir -p public
          REPORT=$(find target -name "surefire*.html" | head -1)
          echo "Report found at: $REPORT"
          cp "$REPORT" public/index.html
          cp -r target/site/css target/site/images public/ 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
